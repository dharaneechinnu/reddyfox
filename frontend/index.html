<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!--
      The webfont stylesheet lives here, with an id, rather than as an @import
      in index.css: src/context/ThemeContext.jsx repoints its href when staff
      change the fonts in the Django admin, and changing a font family without
      also loading that font would silently fall back to a system face. This
      href is the default, used until (and if) the theme API answers.
    -->
    <link
      id="fx-fonts"
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap"
    />

    <!--
      This is a client-rendered SPA — everything in <head> is what a crawler
      sees if it does NOT execute JavaScript. src/components/Seo.jsx swaps in
      a per-page title/description/canonical after mount for crawlers that
      do, but these defaults are the only guaranteed-seen version, so they're
      written to stand on their own. See docs/seo-and-ai-discoverability.md.
    -->
    <title>Reddy Forex Private Limited — Foreign Currency Exchange in Chennai</title>
    <meta name="description" content="RBI-authorised money changer in T. Nagar, Chennai since 2000. Buy and sell foreign currency, Western Union money transfer, forex cards and outward remittance at competitive rates." />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://www.reddyforex.com/" />

    <meta property="og:site_name" content="Reddy Forex Private Limited" />
    <meta property="og:title" content="Reddy Forex Private Limited — Foreign Currency Exchange in Chennai" />
    <meta property="og:description" content="RBI-authorised money changer in T. Nagar, Chennai since 2000. Buy and sell foreign currency, Western Union money transfer, forex cards and outward remittance at competitive rates." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.reddyforex.com/" />
    <meta property="og:locale" content="en_IN" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Reddy Forex Private Limited — Foreign Currency Exchange in Chennai" />
    <meta name="twitter:description" content="RBI-authorised money changer in T. Nagar, Chennai since 2000. Buy and sell foreign currency, Western Union money transfer, forex cards and outward remittance at competitive rates." />

    <!--
      Business structured data for search results. Static, because it has to be
      in the HTML for crawlers that don't run JavaScript (see
      docs/seo-and-ai-discoverability.md).

      openingHoursSpecification below must match the hours staff set in the
      Django admin (Content -> Site settings -> Counter opening hours), which is
      what the site itself renders — if the counter's hours change, change them
      in both places. Sunday is absent because the shop is closed then: in
      schema.org a closed day is stated by omission, not by an empty range.
    -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": ["FinancialService", "LocalBusiness"],
        "name": "Reddy Forex Private Limited",
        "alternateName": "Reddy Forex",
        "description": "We specialize in providing the Money Exchange Services are Fast",
        "url": "https://www.reddyforex.com",
        "telephone": "+919941456261",
        "email": "reddyforex@gmail.com",
        "address": {
          "@type": "PostalAddress",
          "streetAddress": "Shop No 105, Challa Mall, 17 Thyagaraya Road, T. Nagar",
          "addressLocality": "Chennai",
          "addressRegion": "Tamil Nadu",
          "postalCode": "600017",
          "addressCountry": "IN"
        },
        "areaServed": "Chennai, Tamil Nadu, India",
        "openingHoursSpecification": [
          {
            "@type": "OpeningHoursSpecification",
            "dayOfWeek": ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"],
            "opens": "09:30",
            "closes": "19:00"
          }
        ],
        "sameAs": [
          "https://www.facebook.com/Reddy-Forex-Private-Limited-100909432036543",
          "https://x.com/ReddyForex",
          "https://www.youtube.com/channel/UCrFuWjK4Yfma9A6RMbywE5g"
        ]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
